[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corecoder"
version = "0.8.0"
description = "Offline-first reliability engineering fork of upstream CoreCoder, a minimal AI coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version<'3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder"]
# An ASCII .pth import hook avoids locale-decoding non-ASCII checkout paths
# on Windows Python 3.10/3.11; normal wheel installs are unaffected.
dev-mode-exact = true

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
knowledge = [
    "langchain-core==1.8.0", "pydantic==2.14.1",
    "langchain-text-splitters==1.1.3", "langchain-chroma==1.1.0",
    "chromadb==1.5.9", "pathspec==1.1.1",
]
graph = ["langgraph==1.2.20", "langgraph-checkpoint-sqlite==3.1.3"]
mcp = ["mcp==2.3.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
corecoder = "corecoder.cli:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/CoreCoder"
Repository = "https://github.com/he-yufeng/CoreCoder"
Issues = "https://github.com/he-yufeng/CoreCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py310"
