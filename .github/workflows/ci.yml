name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "article/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "article/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests --ignore=tests/test_live_smoke.py -q

      - name: Compile
        run: python -m compileall -q corecoder evals tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

  knowledge-prompts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]
    env:
      CORECODER_REQUIRE_KNOWLEDGE_TESTS: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository knowledge dependencies
        run: python -m pip install -e ".[dev,knowledge]"
      - name: Run required integration tests
        run: python -m pytest tests/integrations tests/knowledge tests/memory -q
      - name: Run local storage demonstrations
        run: |
          python -m examples.knowledge_index_demo
          python -m examples.repo_qa_demo
          python -m examples.memory_demo
      - name: Check deterministic memory lifecycle
        run: python -m evals.memory_runner
      - name: Compare offline Prompt contracts
        run: python -m evals.prompt_runner --compare v1 v2 --offline
      - name: Check dependency resolution
        run: python -m pip check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install -U pip ruff

      - name: Ruff check
        run: ruff check corecoder tests examples evals

  graph-workflows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]
    env:
      CORECODER_REQUIRE_KNOWLEDGE_TESTS: "1"
      CORECODER_REQUIRE_GRAPH_TESTS: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install graph and repository dependencies
        run: python -m pip install -e ".[dev,knowledge,graph]"
      - name: Run required workflow and runtime tests
        run: python -m pytest tests --ignore=tests/test_live_smoke.py -q
      - name: Run actual graph recovery demonstration
        run: python -m examples.graph_resume_demo
      - name: Compare matched direct and graph recovery
        run: python -m evals.recovery_comparison
      - name: Check dependency resolution
        run: python -m pip check

  knowledge-mcp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]
    env:
      CORECODER_REQUIRE_KNOWLEDGE_TESTS: "1"
      CORECODER_REQUIRE_GRAPH_TESTS: "1"
      CORECODER_REQUIRE_MCP_TESTS: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install official SDK and repository extensions
        run: python -m pip install -e ".[dev,knowledge,graph,mcp]"
      - name: Test actual stdio and resource cleanup
        run: python -m pytest tests/integrations/test_knowledge_mcp.py -q
      - name: Compare graph, Agent and independent SDK sources
        run: python -m examples.knowledge_mcp_demo
      - name: Check dependency resolution
        run: python -m pip check

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install offline eval dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      # Check the committed evidence before regeneration replaces its commit SHA.
      - name: Validate checked-in README benchmark evidence
        run: python -m evals.readme_benchmark --check

      - name: Generate matched baseline and candidate
        run: |
          python -m evals.runner --suite all --variant baseline
          python -m evals.runner --suite all --variant candidate

      - name: Enforce safety and reliability gates
        run: python -m evals.compare baseline candidate

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-eval-comparison
          path: evals/results/
